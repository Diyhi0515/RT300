# RT-300 nuevo sistema — entorno de desarrollo con Docker
# Servicios: db (SQL Server 2017) · db-init (restaura la BD) · backend (Flask) · frontend (React/Vite)
# Uso:  docker compose up -d --build        (ver README / 03-puesta-en-marcha.md)

name: rt300

services:
  # ───────────────────────────── Base de datos ─────────────────────────────
  db:
    image: mcr.microsoft.com/mssql/server:2017-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Rt300_Sa_2026!}"
      MSSQL_PID: "Developer"
    ports:
      - "127.0.0.1:${DB_PORT:-1433}:1433"   # solo local: no exponer SQL Server a la red
    volumes:
      - sqldata:/var/opt/mssql
      # Backup de la BD (solo lectura). Ruta configurable en .env (BACKUP_FILE)
      - "${BACKUP_FILE:-../tbpos_new_2026-07-24.bak}:/backup/tbpos_new.bak:ro"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'"]
      interval: 10s
      retries: 20

  # Restaura tbpos_new si no existe y crea el login de pruebas. Termina con Exited (0): es normal.
  db-init:
    image: mcr.microsoft.com/mssql/server:2017-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Rt300_Sa_2026!}"
      APP_DB_PASSWORD: "${DB_PASSWORD:-Rt300App2026x}"
    volumes:
      - ./docker/db/init.sql:/init.sql:ro
    entrypoint: ["/bin/bash", "-c", "/opt/mssql-tools18/bin/sqlcmd -C -S db -U sa -P \"$$MSSQL_SA_PASSWORD\" -v APP_PASSWORD=\"$$APP_DB_PASSWORD\" -i /init.sql || /opt/mssql-tools/bin/sqlcmd -S db -U sa -P \"$$MSSQL_SA_PASSWORD\" -v APP_PASSWORD=\"$$APP_DB_PASSWORD\" -i /init.sql"]
    restart: "no"

  # ───────────────────────────── Redis OPCIONAL (solo si hay varias instancias: docker compose --profile redis up -d y REDIS_URL en .env) ─────────────────────────────
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-Rt300Redis2026x}", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-Rt300Redis2026x}"

  # ───────────────────────────── Proxy HTTPS (opcional: docker compose --profile https up -d) ─────────────────────────────
  proxy:
    image: caddy:2-alpine
    profiles: ["https"]
    depends_on:
      - backend
      - frontend
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./docker/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

  # ───────────────────────────── Proxy de PRODUCCIÓN (front compilado + CSP): npm run build y luego
  #   PROXY_HOPS=1 docker compose --profile produccion up -d backend proxy-prod
  proxy-prod:
    image: caddy:2-alpine
    profiles: ["produccion"]
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8444:8444"
    volumes:
      - ./docker/proxy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - ./rt300-frontend/dist:/srv:ro
      - caddy_data_prod:/data

  # ───────────────────────────── Backend (Flask) ─────────────────────────────
  backend:
    build: ./rt300-backend
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      REDIS_URL: "${REDIS_URL:-}"
      COOKIE_SECURE: "${COOKIE_SECURE:-}"
      REVOCADOS_DB: "/data/app/revocados.sqlite"
      FLASK_ENV: "${FLASK_ENV:-production}"
      SECRET_KEY: "${SECRET_KEY:-dev-secret-cambiar}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-dev-jwt-secret-cambiar-por-uno-largo-de-32-o-mas}"
      JWT_ACCESS_MINUTES: "15"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"

      DB_DRIVER: "ODBC Driver 18 for SQL Server"
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_INTERNAL_PORT:-1433}"
      DB_NAME: "tbpos_new"
      DB_USER: "${DB_USER:-rt300_app}"
      DB_PASSWORD: "${DB_PASSWORD:-Rt300App2026x}"
      DB_TRUST_CERT: "yes"

      # fake | soap | dll | http  (ver 01-backend-flask.md §7)
      GATEWAY_MODE: "${GATEWAY_MODE:-fake}"
      GATEWAY_WSDL_URL: "${GATEWAY_WSDL_URL:-}"
      GATEWAY_HTTP_URL: "${GATEWAY_HTTP_URL:-}"
      GATEWAY_DLL_PATH: "${GATEWAY_DLL_PATH:-}"
      GATEWAY_PASSWORD: "${GATEWAY_PASSWORD:-}"
      MENU_CACHE_SECONDS: "${MENU_CACHE_SECONDS:-300}"
      PROXY_HOPS: "${PROXY_HOPS:-0}"
      RATE_LIMIT_DEFAULT: "${RATE_LIMIT_DEFAULT:-300 per minute}"
      ADMIN_USERS: "${ADMIN_USERS:-}"
      CAJERO_USERS: "${CAJERO_USERS:-}"
      GATEWAY_TIMEOUT_SECONDS: "30"

      IMAGENES_DIR: "/data/imagenes"
      IMAGENES_CACHE_DIR: "/data/cache"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./rt300-backend:/app                       # recarga en caliente
      - "${IMAGENES_DIR:-./img/Restaurantes}:/data/imagenes:ro"
      - imgcache:/data/cache
      - appdata:/data/app
    # Desarrollo: servidor Flask con recarga, SIN depurador interactivo (la consola de Werkzeug permite ejecutar código). Producción: quitar esta línea y usar el CMD (waitress) del Dockerfile.
    command: ["flask", "--app", "wsgi", "run", "--host=0.0.0.0", "--port=5000", "--reload", "--no-debugger"]

  # ───────────────────────────── Frontend (React + Vite) ─────────────────────────────
  frontend:
    build: ./rt300-frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: "${VITE_API_URL:-http://127.0.0.1:5000/api/v1}"
      CHOKIDAR_USEPOLLING: "true"                  # detectar cambios en carpetas montadas desde Windows
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./rt300-frontend:/app
      - frontend_node_modules:/app/node_modules    # no pisar node_modules de la imagen

volumes:
  sqldata:
  imgcache:
  appdata:
  frontend_node_modules:
  caddy_data:
  caddy_data_prod:
